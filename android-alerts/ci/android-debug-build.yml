# Шаблон. Запускается только после размещения в .github/workflows в репозитории.
name: Android debug build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Check installed Android SDK 35
        shell: bash
        run: test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Build debug APK
        working-directory: android-alerts
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lena-alerts-debug
          path: android-alerts/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
